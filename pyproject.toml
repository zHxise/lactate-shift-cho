[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lactateshift"
version = "0.1.0"
description = "Deteccion y prediccion temprana del lactate shift en cultivos de celulas de mamifero"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Braulio Arturo Rodriguez Angulo", email = "iaartroz@gmail.com" }]
keywords = ["bioprocess", "cell-culture", "CHO", "lactate", "time-to-event", "manufacturing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
analysis = ["openpyxl>=3.1", "matplotlib>=3.7", "scikit-learn>=1.3", "lifelines>=0.27", "shap>=0.44"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Repository = "https://github.com/USUARIO/lactate-shift-cho"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
